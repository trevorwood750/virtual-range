<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101820" />
  <title>Range Lab | Dry Fire Simulator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1118;
      --panel: #171f29;
      --panel-2: #1d2b38;
      --line: #2b3d4f;
      --ink: #edf3f7;
      --muted: #9fb3bf;
      --gold: #e1b86d;
      --gold-2: #efcf7d;
      --green: #7fc9a0;
      --red: #ef5d4f;
      --shadow: rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% -8%, #2b3a48 0%, #0d141b 46%, #090e12 100%);
      color: var(--ink);
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button, select {
      font: inherit;
    }

    .app {
      max-width: 1450px;
      margin: 0 auto;
      padding: clamp(12px, 2vw, 28px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
    }

    .logo {
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: clamp(18px, 2vw, 28px);
    }

    .logo small {
      letter-spacing: 0.17em;
      font-size: 10px;
      color: var(--muted);
      font-weight: 700;
    }

    .mode-pill {
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(20, 29, 35, 0.8);
      color: #d7e2ea;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: linear-gradient(145deg, rgba(25, 34, 44, 0.96), rgba(15, 21, 27, 0.96));
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      padding: 14px;
    }

    .range-panel {
      padding: 0;
      overflow: hidden;
      border-radius: 12px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 320px;
      background: linear-gradient(180deg, #586d77 0%, #7c7a6b 30%, #504b42 53%, #2a2f2d 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .stage-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(5,9,12,0.30), transparent 12%, transparent 88%, rgba(5,9,12,0.30)),
        linear-gradient(180deg, rgba(12,19,25,0.08), transparent 18%, transparent 74%, rgba(7,10,13,0.25));
    }

    .label {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      padding: 8px 11px;
      background: rgba(9, 17, 25, 0.76);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 7px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .score-box {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #e7edf3;
      background: rgba(11, 16, 22, 0.7);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 10px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      appearance: none;
      border: 1px solid #415466;
      background: linear-gradient(180deg, #263748, #1b2a35);
      color: var(--ink);
      border-radius: 8px;
      padding: 10px 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }

    .btn:hover { border-color: #8faab8; }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: linear-gradient(180deg, #f1d08b, #d3a24e);
      color: #1c232b;
      border-color: #f7dca0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .stat {
      padding: 11px 10px 9px;
      border-radius: 9px;
      background: linear-gradient(180deg, #213244, #141d28);
      border: 1px solid var(--line);
    }

    .stat strong {
      display: block;
      font-size: clamp(22px, 1.5vw, 28px);
      line-height: 1.1;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
    }

    .stat span {
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 9px;
      font-weight: 800;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .side .panel {
      padding: 12px 14px;
    }

    .side h3 {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #dfeaf2;
    }

    .field {
      margin: 12px 0;
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #425866;
      background: rgba(24, 33, 42, 0.9);
      color: var(--ink);
      padding: 10px 12px;
      font-weight: 600;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .game-btn {
      min-height: 42px;
      padding: 10px 6px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #1e2d39, #162330);
      color: var(--ink);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
      cursor: pointer;
    }

    .game-btn.active {
      background: linear-gradient(180deg, #f3d583, #d6a652);
      color: #182329;
      border-color: #fbe7b5;
    }

    .note {
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 12px;
    }

    .history {
      max-height: 150px;
      overflow: auto;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(15, 22, 29, 0.35);
      padding: 0 8px;
    }

    .history div {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 8px 4px;
      font-size: 12px;
      color: #d4dfe8;
    }

    .history div:last-child { border-bottom: none; }

    .foot {
      margin-top: 14px;
      text-align: center;
      color: #8fa0ad;
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .side { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
      .side .wide { grid-column: 1 / -1; }
    }

    @media (max-width: 520px) {
      .app { padding: 10px; }
      .header { align-items: flex-start; }
      .mode-pill { letter-spacing: 0.08em; }
      .stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .side { display: flex; }
      .games { grid-template-columns: 1fr; }
      .btn { flex: 1 1 40%; }
      .stage { min-height: 210px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">Range Lab<small>dry fire practice</small></div>
      <div class="mode-pill">Practice mode</div>
    </header>

    <div class="layout">
      <section class="panel range-panel">
        <div class="stage" id="stage">
          <canvas id="rangeCanvas"></canvas>
          <div class="stage-overlay"></div>
          <div class="label" id="sceneTitle">Pop-up knockdown</div>
          <div class="score-box">Score: <span id="scoreValue">0</span></div>
        </div>

        <div class="controls">
          <button class="btn primary" id="startBtn">Start drill</button>
          <button class="btn" id="resetBtn">Reset</button>
          <button class="btn" id="fullscreenBtn">Full screen</button>
        </div>

        <div class="stats">
          <div class="stat"><strong id="hitsValue">0</strong><span>Hits</span></div>
          <div class="stat"><strong id="lastValue">—</strong><span>Last score</span></div>
          <div class="stat"><strong id="timeValue">00:00</strong><span>Time</span></div>
          <div class="stat"><strong id="accuracyValue">—</strong><span>Accuracy</span></div>
        </div>
      </section>

      <aside class="side">
        <section class="panel wide">
          <h3>Choose a drill</h3>
          <div class="games">
            <button class="game-btn active" data-game="knock">Pop-up</button>
            <button class="game-btn" data-game="steel">Steel rack</button>
            <button class="game-btn" data-game="spinner">Spinner</button>
            <button class="game-btn" data-game="balloon">Balloon</button>
            <button class="game-btn" data-game="bottles">Bottle line</button>
            <button class="game-btn" data-game="moving">Moving</button>
          </div>

          <div class="field">
            <label for="layoutSelect">Target layout</label>
            <select id="layoutSelect">
              <option value="5">5 targets</option>
              <option value="7" selected>7 targets</option>
              <option value="9">9 targets</option>
            </select>
          </div>
        </section>

        <section class="panel">
          <h3>Shot history</h3>
          <div class="history" id="history"><div>No hits recorded.</div></div>
        </section>
      </aside>
    </div>

    <div class="foot">Dry-fire practice only • use inert training devices and follow safe handling rules.</div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('rangeCanvas');
      const ctx = canvas.getContext('2d');
      const stage = document.getElementById('stage');
      const startBtn = document.getElementById('startBtn');
      const resetBtn = document.getElementById('resetBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const scoreValue = document.getElementById('scoreValue');
      const hitsValue = document.getElementById('hitsValue');
      const lastValue = document.getElementById('lastValue');
      const timeValue = document.getElementById('timeValue');
      const accuracyValue = document.getElementById('accuracyValue');
      const historyEl = document.getElementById('history');
      const layoutSelect = document.getElementById('layoutSelect');
      const sceneTitle = document.getElementById('sceneTitle');

      const gameLabels = {
        knock: 'Pop-up knockdown',
        steel: 'Steel rack',
        spinner: 'Reactive spinner',
        balloon: 'Balloon arcade',
        bottles: 'Bottle line',
        moving: 'Moving targets'
      };

      const layouts = {
        5: [[0.15, 0.30], [0.35, 0.25], [0.5, 0.30], [0.65, 0.25], [0.85, 0.30]],
        7: [[0.12, 0.28], [0.36, 0.22], [0.64, 0.22], [0.88, 0.28], [0.25, 0.60], [0.50, 0.57], [0.75, 0.60]],
        9: [[0.10, 0.28], [0.30, 0.24], [0.50, 0.24], [0.70, 0.24], [0.90, 0.28], [0.20, 0.62], [0.40, 0.58], [0.60, 0.58], [0.80, 0.62]]
      };

      let game = 'knock';
      let layoutCount = 7;
      let targets = [];
      let hits = 0;
      let totalScore = 0;
      let misses = 0;
      let running = false;
      let startedAt = 0;
      let timerId = null;
      let rafId = null;
      let animationTime = 0;

      function resize() {
        const rect = stage.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.round(rect.width * ratio);
        canvas.height = Math.round(rect.height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        draw();
      }

      function makeTargets() {
        const positions = layouts[layoutCount];
        const baseScale = layoutCount === 5 ? 1.1 : layoutCount === 9 ? 0.92 : 1;

        targets = positions.map(([x, y], index) => {
          const size = game === 'spinner' ? 0.09 : game === 'balloon' ? 0.08 : game === 'bottles' ? 0.08 : 0.11;
          return {
            x, y,
            w: size * baseScale,
            h: game === 'spinner' ? 0.18 : game === 'balloon' ? 0.18 : game === 'bottles' ? 0.22 : 0.25,
            alive: true,
            phase: index * 0.8,
            rotation: 0,
            scale: 1,
            hitFlash: 0
          };
        });
        draw();
      }

      function safeText(text, x, y, size, color, weight = 800) {
        ctx.font = `${weight} ${size}px Inter, Segoe UI, sans-serif`;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.fillText(text, x, y);
      }

      function drawBackground() {
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        ctx.clearRect(0, 0, w, h);

        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#4f6874');
        sky.addColorStop(0.42, '#8d9383');
        sky.addColorStop(0.65, '#615b4d');
        sky.addColorStop(1, '#1d2120');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        const sun = ctx.createRadialGradient(w * 0.75, h * 0.14, 20, w * 0.75, h * 0.14, 220);
        sun.addColorStop(0, 'rgba(255, 236, 177, 0.9)');
        sun.addColorStop(0.38, 'rgba(255, 208, 118, 0.4)');
        sun.addColorStop(1, 'rgba(255, 208, 118, 0)');
        ctx.fillStyle = sun;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#5d5a4f';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.56);
        ctx.lineTo(w * 0.16, h * 0.38);
        ctx.lineTo(w * 0.32, h * 0.54);
        ctx.lineTo(w * 0.48, h * 0.34);
        ctx.lineTo(w * 0.62, h * 0.52);
        ctx.lineTo(w * 0.8, h * 0.30);
        ctx.lineTo(w, h * 0.43);
        ctx.lineTo(w, h * 0.78);
        ctx.lineTo(0, h * 0.78);
        ctx.closePath();
        ctx.fill();

        const ground = ctx.createLinearGradient(0, h * 0.66, 0, h);
        ground.addColorStop(0, '#8c765b');
        ground.addColorStop(0.35, '#5a4d42');
        ground.addColorStop(1, '#262a2c');
        ctx.fillStyle = ground;
        ctx.fillRect(0, h * 0.64, w, h * 0.36);

        ctx.strokeStyle = 'rgba(230, 212, 167, 0.22)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
          const y = h * (0.7 + i * 0.06);
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y + 16);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        for (let i = 1; i < 8; i++) {
          ctx.fillRect((w / 8) * i, h * 0.68, 2, h * 0.2);
        }
      }

      function drawTarget(target, index) {
        const x = target.x * stage.clientWidth;
        const y = target.y * stage.clientHeight;
        const w = target.w * stage.clientWidth;
        const h = target.h * stage.clientHeight;

        if (!target.alive) return;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(target.rotation || 0);
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 5;

        if (game === 'balloon') {
          const body = ctx.createRadialGradient(-w * 0.15, -h * 0.22, 10, 0, 0, w * 0.7);
          body.addColorStop(0, '#d7a05a');
          body.addColorStop(0.35, '#d84a3d');
          body.addColorStop(1, '#8e3035');
          ctx.fillStyle = body;
          ctx.beginPath();
          ctx.ellipse(0, 0, w * 0.55, h * 0.52, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255,255,255,0.3)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(-w * 0.12, -h * 0.14, w * 0.1, h * 0.12, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = '#f1ddbd';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, h * 0.52);
          ctx.lineTo(0, h * 0.78);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(-w * 0.08, h * 0.78);
          ctx.lineTo(0, h * 0.95);
          ctx.lineTo(w * 0.08, h * 0.78);
          ctx.fillStyle = '#e4d9be';
          ctx.fill();
        } else if (game === 'spinner') {
          ctx.strokeStyle = '#d5dfde';
          ctx.lineWidth = Math.max(3, w * 0.12);
          for (let i = 0; i < 4; i++) {
            const angle = i * (Math.PI / 2) + target.rotation;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(angle) * w * 0.6, Math.sin(angle) * h * 0.42);
            ctx.stroke();
          }
          ctx.fillStyle = '#1f2c31';
          ctx.beginPath();
          ctx.arc(0, 0, w * 0.16, 0, Math.PI * 2);
          ctx.fill();
        } else if (game === 'bottles') {
          const bottleW = w * 0.7;
          const bottleH = h * 0.8;
          ctx.fillStyle = '#dfe8e7';
          ctx.strokeStyle = '#1f2a2f';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(-bottleW * 0.42, -bottleH * 0.4, bottleW, bottleH, 8);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#b58a52';
          ctx.fillRect(-bottleW * 0.18, -bottleH * 0.12, bottleW * 0.36, bottleH * 0.35);
        } else if (game === 'steel') {
          ctx.fillStyle = '#dce5e3';
          ctx.strokeStyle = '#23323c';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-w * 0.4, -h * 0.38);
          ctx.lineTo(w * 0.4, -h * 0.38);
          ctx.lineTo(w * 0.52, -h * 0.12);
          ctx.lineTo(w * 0.34, h * 0.12);
          ctx.lineTo(w * 0.28, h * 0.48);
          ctx.lineTo(-w * 0.28, h * 0.48);
          ctx.lineTo(-w * 0.34, h * 0.12);
          ctx.lineTo(-w * 0.52, -h * 0.12);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#2a3038';
          ctx.beginPath();
          ctx.arc(0, -h * 0.14, w * 0.14, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#e4e1d7';
          ctx.strokeStyle = '#26343d';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-w * 0.38, -h * 0.48);
          ctx.lineTo(w * 0.38, -h * 0.48);
          ctx.lineTo(w * 0.48, -h * 0.18);
          ctx.lineTo(w * 0.34, h * 0.18);
          ctx.lineTo(w * 0.26, h * 0.48);
          ctx.lineTo(-w * 0.26, h * 0.48);
          ctx.lineTo(-w * 0.34, h * 0.18);
          ctx.lineTo(-w * 0.48, -h * 0.18);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#d24740';
          ctx.beginPath();
          ctx.arc(0, -h * 0.12, w * 0.12, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#d24740';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-w * 0.18, -h * 0.02);
          ctx.lineTo(w * 0.18, -h * 0.02);
          ctx.stroke();
        }

        ctx.restore();
      }

      function draw() {
        drawBackground();

        for (let i = 0; i < targets.length; i++) {
          if (targets[i].alive) {
            drawTarget(targets[i], i);
          }
        }
      }

      function updateStats() {
        hitsValue.textContent = String(hits);
        scoreValue.textContent = String(totalScore);
        accuracyValue.textContent = hits + misses > 0 ? `${Math.round((hits / (hits + misses)) * 100)}%` : '—';
      }

      function produceHistoryEntry(value) {
        const div = document.createElement('div');
        div.textContent = `Hit • +${value} points`;
        historyEl.prepend(div);
      }

      function hitTarget(pointerX, pointerY) {
        const xPx = pointerX * stage.clientWidth;
        const yPx = pointerY * stage.clientHeight;

        let best = null;
        let bestIndex = -1;

        for (let i = 0; i < targets.length; i++) {
          const t = targets[i];
          if (!t.alive) continue;
          const cx = t.x * stage.clientWidth;
          const cy = t.y * stage.clientHeight;
          const rx = t.w * stage.clientWidth * 0.6;
          const ry = t.h * stage.clientHeight * 0.6;
          const dx = xPx - cx;
          const dy = yPx - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist <= Math.max(rx, ry)) {
            const score = Math.max(1, Math.round(10 - dist / Math.max(8, Math.min(rx, ry))));
            if (!best || score > best) {
              best = score;
              bestIndex = i;
            }
          }
        }

        if (bestIndex === -1) {
          misses += 1;
          updateStats();
          return;
        }

        const target = targets[bestIndex];
        target.alive = false;
        hits += 1;
        totalScore += best;
        lastValue.textContent = String(best);
        updateStats();
        produceHistoryEntry(best);

        if (game === 'spinner') {
          target.alive = true;
          target.rotation += 0.8;
        } else if (game === 'moving') {
          target.alive = false;
        }

        if (targets.every((t) => !t.alive)) {
          window.setTimeout(() => {
            makeTargets();
          }, 420);
        }

        draw();
      }

      function startDrill() {
        if (running) {
          running = false;
          clearInterval(timerId);
          cancelAnimationFrame(rafId);
          startBtn.textContent = 'Start drill';
          return;
        }

        running = true;
        startedAt = Date.now();
        startBtn.textContent = 'Pause drill';

        const tick = () => {
          const elapsed = Math.floor((Date.now() - startedAt) / 1000);
          const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
          const secs = String(elapsed % 60).padStart(2, '0');
          timeValue.textContent = `${mins}:${secs}`;

          animationTime += 0.016;
          if (game === 'moving') {
            targets.forEach((t, i) => {
              if (t.alive) {
                t.x = 0.10 + (((Math.sin(animationTime * 1.25 + i) + 1) / 2) * 0.82);
              }
            });
          }

          if (game === 'spinner') {
            targets.forEach((t) => {
              if (t.alive) {
                t.rotation += 0.08;
              }
            });
          }

          draw();
          rafId = requestAnimationFrame(tick);
        };

        rafId = requestAnimationFrame(tick);
      }

      function resetDrill() {
        clearInterval(timerId);
        cancelAnimationFrame(rafId);
        running = false;
        startBtn.textContent = 'Start drill';
        hits = 0;
        totalScore = 0;
        misses = 0;
        lastValue.textContent = '—';
        timeValue.textContent = '00:00';
        historyEl.innerHTML = '<div>No hits recorded.</div>';
        makeTargets();
        updateStats();
      }

      function applyGame(gameName) {
        game = gameName;
        sceneTitle.textContent = gameLabels[gameName];
        document.querySelectorAll('.game-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.game === gameName);
        });
        makeTargets();
      }

      startBtn.addEventListener('click', startDrill);
      resetBtn.addEventListener('click', resetDrill);
      fullscreenBtn.addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement) {
            await stage.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (err) {
          console.warn('Fullscreen not supported', err);
        }
      });

      layoutSelect.addEventListener('change', (e) => {
        layoutCount = Number(e.target.value);
        makeTargets();
      });

      document.querySelectorAll('.game-btn').forEach((btn) => {
        btn.addEventListener('click', () => applyGame(btn.dataset.game));
      });

      stage.addEventListener('pointerdown', (event) => {
        const rect = stage.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;
        hitTarget(x, y);
      });

      window.addEventListener('resize', resize);
      resize();
      makeTargets();
      updateStats();
    })();
  </script>
</body>
</html>
